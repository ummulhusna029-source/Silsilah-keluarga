<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silsilah Keluarga Bani Soim</title>
    <script src="https://balkangraph.com/js/familytree.js"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
        #tree { width: 100%; height: 100%; background-color: #f4f1ea; }
        .btn-tambah { position: fixed; bottom: 20px; right: 20px; padding: 15px 25px; background: #8d6e63; color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-weight: bold; z-index: 100; }
    </style>
</head>
<body>

    <div id="tree"></div>
    <button class="btn-tambah" onclick="window.open('https://docs.google.com/spreadsheets/d/1vZ_BVgC_1lzhUTwLhu2imx0WsqMOs4U_BLIfcaj1-1I/edit', '_blank')">
        + Tambah/Edit Data
    </button>

    <script>
        const urlCSV = 'https://docs.google.com/spreadsheets/d/1vZ_BVgC_1lzhUTwLhu2imx0WsqMOs4U_BLIfcaj1-1I/export?format=csv';

        async function loadTree() {
            const response = await fetch(urlCSV);
            const dataText = await response.text();
            const rows = dataText.split('\n').slice(1);
            
            const familyData = [];

            rows.forEach(row => {
                const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if (cols[0] && cols[0].trim() !== "") {
                    familyData.push({
                        id: cols[0].trim(),
                        pids: cols[6] ? [cols[6].trim()] : [], // ID Pasangan
                        mid: cols[5] ? cols[5].trim() : null,  // ID Ibu
                        fid: cols[4] ? cols[4].trim() : null,  // ID Ayah
                        name: cols[1].replace(/"/g, '').trim(),
                        born: cols[2] ? cols[2].replace(/"/g, '').trim() : '',
                        dead: cols[3] ? cols[3].replace(/"/g, '').trim() : '',
                        img: cols[7] ? cols[7].replace(/"/g, '').trim() : ''
                    });
                }
            });

            var family = new FamilyTree(document.getElementById("tree"), {
                mouseScrol: FamilyTree.none,
                mode: 'dark',
                template: 'tommy',
                nodeBinding: {
                    field_0: "name",
                    field_1: "born",
                    img_0: "img"
                },
                nodes: familyData
            });
        }

        loadTree();
    </script>
</body>
</html>
