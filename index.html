<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silsilah Keluarga</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f9f9f9; padding: 20px; }
        .pohon { display: flex; flex-direction: column; align-items: center; }
        .kartu { background: white; border: 2px solid #8d6e63; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); min-width: 150px; margin: 10px; }
        h1 { color: #5d4037; }
        h3 { margin: 0; color: #3e2723; }
        p { margin: 5px 0 0; font-size: 0.9em; color: #757575; }
    </style>
</head>
<body>
    <h1>Silsilah Bani Soim</h1>
    
    <div class="pohon">
        <div class="kartu">
            <h3>Bani Soim</h3>
            <p>Pusat Silsilah</p>
        </div>

        <div style="font-size: 24px; color: #8d6e63;">⬇️</div>

        <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;">
            <div class="kartu">
                <h3>Nama Anak 1</h3>
                <p>Keturunan Pertama</p>
            </div>
            <div class="kartu">
                <h3>Nama Anak 2</h3>
                <p>Keturunan Kedua</p>
            </div>
            <div class="kartu">
                <h3>Nama Anak 3</h3>
                <p>Keturunan Ketiga</p>
            </div>
        </div>
    </div>

    <footer style="margin-top: 50px; font-size: 0.8em; color: #888;">
        <p>&copy; 2026 Dokumen Keluarga Bani Soim</p>
    </footer>
</body>
